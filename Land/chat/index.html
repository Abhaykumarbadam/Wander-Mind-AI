<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura - Your AI Travel Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Inline&family=Great+Vibes&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css?v=4">
</head>

<body>
    <!-- Background Video Container -->
    <div class="video-background" id="videoBackground">
        <video id="bgVideo" autoplay muted loop playsinline>
            <!-- Placeholder for your video file -->
            <source src="../../video/background.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <!-- Chat Interface -->
    <div class="chat-interface" id="chatInterface">
        <!-- Floating Chat History Button -->
        <button class="floating-history-btn" id="floatingHistoryBtn" title="Open chat history">
            <svg viewBox="0 0 24 24" width="18" height="18">
                <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor" />
            </svg>
            <span>Chat History</span>
        </button>

        <!-- Chat Sidebar -->
        <aside class="chat-sidebar" id="chatSidebar">
            <div class="sidebar-header">
                <div class="sidebar-top">
                    <h3 class="sidebar-title">
                        <svg class="sidebar-icon" viewBox="0 0 24 24" width="20" height="20">
                            <path
                                d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4V8l8 5 8-5v10zm-8-7L4 6h16l-8 5z"
                                fill="currentColor" />
                        </svg>
                        Chat History
                    </h3>
                    <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="Collapse sidebar"
                        aria-label="Toggle sidebar">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor" />
                        </svg>
                    </button>
                </div>
                <button class="new-chat-btn" id="newChatBtn">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor" />
                    </svg>
                    <span>New Chat</span>
                </button>
                <button class="itinerary-btn" id="itineraryBtn" title="View your travel itinerary">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path
                            d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
                            fill="currentColor" />
                    </svg>
                    <span>My Journey</span>
                </button>
            </div>
            <div class="chat-history-section">
                <h4 class="history-title">Previous chats</h4>
                <div class="chat-history" id="chatHistory">
                    <!-- Previous chats will be loaded here -->
                    <div class="history-loading">
                        <div class="spinner"></div>
                        <p>Loading chats...</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Landing View (Initial State) -->
        <div class="landing-container" id="landingView">
            <div class="landing-content">
                <!-- Logo/Branding -->
                <div class="brand-section">
                    <h1 class="brand-name">Hey I'm Aura,<br><span class="brand-tagline">your AI trip planner</span></h1>
                    <p class="brand-description">Tell me your style and budget, and I'll design a trip for you.</p>
                </div>

                <!-- Chat Input Area -->
                <div class="chat-input-container">
                    <div class="input-wrapper">
                        <textarea id="landingInput" class="landing-input"
                            placeholder="Help me plan a budget-friendly vacation to Barcelona" rows="1"></textarea>
                        <button class="landing-send-icon-btn" id="landingSendBtn" title="Send message"
                            aria-label="Send message">
                            <svg class="send-icon" viewBox="0 0 24 24" width="24" height="24">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Suggestion Buttons-->
                <div class="suggestions-container">
                    <button class="suggestion-btn" data-prompt="Create a new trip">
                        <svg viewBox="0 0 24 24" width="16" height="16">
                            <path
                                d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.11 0 2-.9 2-2V5c0-1.1-.89-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"
                                fill="currentColor" />
                        </svg>
                        Create a new trip
                    </button>
                    <button class="suggestion-btn" data-prompt="Inspire me where to go">
                        <svg viewBox="0 0 24 24" width="16" height="16">
                            <path
                                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
                                fill="currentColor" />
                        </svg>
                        Inspire me where to go
                    </button>
                    <button class="suggestion-btn" data-prompt="Plan a road trip">
                        <svg viewBox="0 0 24 24" width="16" height="16">
                            <path
                                d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"
                                fill="currentColor" />
                        </svg>
                        Plan a road trip
                    </button>
                    <button class="suggestion-btn" data-prompt="Plan a last-minute escape">
                        <svg viewBox="0 0 24 24" width="16" height="16">
                            <path
                                d="M2.5 19h19v2h-19v-2zm19.57-9.36c-.21-.8-1.04-1.28-1.84-1.06L14.92 10l-6.9-6.43-1.93.51 4.14 7.17-4.97 1.33-1.97-1.54-1.45.39 2.59 4.49s7.12-1.9 16.57-4.43c.81-.23 1.28-1.05 1.07-1.85z"
                                fill="currentColor" />
                        </svg>
                        Plan a last-minute escape
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <main class="chat-main hidden" id="chatMain">
            <!-- Loading Overlay -->
            <div class="loading-overlay hidden" id="loadingOverlay">
                <div class="spinner"></div>
                <p>Aura is planning your trip...</p>
            </div>

            <!-- Header with Dashboard Link -->
            <header class="chat-header">
                <div class="header-left">
                    <button class="hamburger-btn" id="hamburgerBtn" title="Show chat history"
                        aria-label="Toggle sidebar">
                        <svg viewBox="0 0 24 24" width="22" height="22">
                            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor" />
                        </svg>
                    </button>
                    <h2 class="chat-title">
                        <span class="welcome-text">AI Travel Concierge</span>
                    </h2>
                </div>
                <a href="../Main/index.html" class="dashboard-link" title="Back to Dashboard">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor" />
                    </svg>
                    <span>Dashboard</span>
                </a>
            </header>

            <div class="chat-messages-wrapper">
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be appended here -->
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-row">
                    <button class="location-btn" id="shareLocationBtn" title="Share my current location"
                        aria-label="Share location">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path
                                d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
                                fill="currentColor" />
                        </svg>
                    </button>
                    <textarea id="chatInput" class="chat-textarea" placeholder="Type your message..."
                        rows="1"></textarea>
                    <button class="send-message-btn" id="sendMessageBtn" title="Send message" aria-label="Send message">
                        <svg class="send-icon" viewBox="0 0 24 24" width="22" height="22">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor" />
                        </svg>
                    </button>
                </div>
            </div>
        </main>

        <!-- Map Split View (Hidden initially, shown after itinerary confirmation) -->
        <aside class="map-panel hidden" id="mapPanel">
            <div class="map-header">
                <h3>Itinerary Map</h3>
                <button class="close-map-btn" id="closeMapBtn" title="Close map" aria-label="Close map">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path
                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                            fill="currentColor" />
                    </svg>
                </button>
            </div>
            <div class="map-container" id="mapContainer">
                <!-- Map will be rendered here -->
                <div class="map-placeholder">
                    <svg viewBox="0 0 24 24" width="48" height="48">
                        <path
                            d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"
                            fill="currentColor" />
                    </svg>
                    <p>Map visualization will appear here</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- Firebase Init -->
    <script type="module" src="../firebase-init.js"></script>
    <!-- Main Script -->
    <script type="module" src="./script.js?v=3"></script>
</body>

</html>
