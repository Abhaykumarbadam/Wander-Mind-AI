<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
        <link rel="stylesheet" href="style.css" />
        <title>WanderMind</title>
    </head>
    <main>
        <div class="head" id="head">
            <h1>Wander Mind</h1>
            <h3>Travel. Explore. Discover.</h3>
        </div>
    </main>
    <body>

        <div class="container" id="container">
            <div class="form-container sign-up">
                <form >
                    <h1>Create Account</h1>
                    <div class="social-icons">
                        <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
                    </div>
                    <span>or use your email for registration</span>
                    <input type="text" placeholder="Name" id="user-name"/>
                    <input type="email" placeholder="Email" id="registerEmail"/>
                    <input type="password" placeholder="Password" id="registerPassword"/>
                    <button id="registerBtnSubmit">Sign Up</button>
                </form>
            </div>


            <div class="form-container sign-in">
                <form > 
                    <h1>Sign In</h1>
                    <div class="social-icons">
                        <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
                    </div>
                    <span>or use email password </span>
                    <input type="email" placeholder="Email" id="loginEmail"/>
                    <input type="password" placeholder="Password" id="loginPassword"/>
                    <a href="#">Forget Your Password?</a>
                    <button id="loginBtnSubmit">Sign In</button>
                </form>
            </div>
            <div class="toggle-container">
                <div class="toggle">
                    <div class="toggle-panel toggle-left">
                        <h1>Welcome Back!</h1>
                        <p>Enter your personal details to use all of site features</p>
                        <button class="hidden" id="login">Sign In</button>
                    </div>
                    <div class="toggle-panel toggle-right">
                        <h1>Hello, Welcome!</h1>
                        <p>Register with your personal details to use all of site features</p>
                        <button class="hidden" id="register">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
        <script>
            const container = document.getElementById('container');
            const registerBtn = document.getElementById('register');
            const loginBtn = document.getElementById('login');

            registerBtn.addEventListener('click', () => {
            container.classList.add("active");
            });

            loginBtn.addEventListener('click', () => {
            container.classList.remove("active");
            });
        </script>
        <script type="module" src="script.js"></script>
    </body>
</html>
