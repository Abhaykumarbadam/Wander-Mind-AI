<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Map - WanderMind</title>
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="map-container" id="fullScreenMap"></div>

    <!-- Top Controls -->
    <div class="map-controls-top">
        <button class="icon-btn back-btn" id="backBtn"><i class="fas fa-arrow-left"></i></button>
        <div class="trip-title-badge" id="tripTitleBadge">Loading Trip...</div>
        <button class="icon-btn search-btn"><i class="fas fa-search"></i></button>
    </div>

    <!-- Side Controls (Zoom & Layers) -->
    <div class="map-controls-side">
        <div class="control-group">
            <button class="control-btn" id="zoomInBtn"><i class="fas fa-plus"></i></button>
            <button class="control-btn" id="zoomOutBtn"><i class="fas fa-minus"></i></button>
        </div>
        <div class="control-group">
            <button class="control-btn layer-btn active" data-layer="all"><i class="fas fa-layer-group"></i></button>
            <button class="control-btn layer-btn" data-layer="attractions"><i class="fas fa-camera"></i></button>
            <button class="control-btn layer-btn" data-layer="food"><i class="fas fa-utensils"></i></button>
            <button class="control-btn layer-btn" data-layer="hotels"><i class="fas fa-bed"></i></button>
        </div>
        <div class="control-group">
            <button class="control-btn" id="offlineBtn"><i class="fas fa-download"></i></button>
        </div>
    </div>

    <!-- Bottom Sheet -->
    <div class="bottom-sheet" id="locationBottomSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-content">
            <div class="location-header">
                <div class="location-info">
                    <h2 id="sheetTitle">Select a location</h2>
                    <p id="sheetType">Tap a pin to view details</p>
                </div>
                <div class="location-actions">
                    <button class="action-btn primary"><i class="fas fa-directions"></i></button>
                    <button class="action-btn"><i class="fas fa-share-alt"></i></button>
                </div>
            </div>
            <div class="location-details" id="sheetDetails">
                <!-- Dynamic content -->
            </div>
            <div class="location-photos" id="sheetPhotos">
                <!-- Dynamic photos -->
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="script.js"></script>
</body>

</html>
